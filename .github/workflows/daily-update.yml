name: 每日自动更新HR日报

on:
  schedule:
    - cron: "15 2 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 运行抓取脚本
        run: python .github/scripts/fetch_articles.py

      - name: 生成 data.js
        run: python backend/generate_data_js.py

      - name: 构建前端
        run: |
          python .github/scripts/build_static.py
          cp static/index.html index.html

      - name: 提交并推送更新到 GitHub
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html static/index.html data.js
          git diff --cached --quiet || (git commit -m "chore: 自动更新日报数据 $(date +%Y-%m-%d)" && git push)
