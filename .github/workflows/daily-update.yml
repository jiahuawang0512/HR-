name: 每日自动更新HR日报

on:
  schedule:
    - cron: "15 2 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 运行抓取脚本
        run: python .github/scripts/fetch_articles.py

      - name: 生成 data.js
        run: python backend/generate_data_js.py

      - name: 构建前端
        run: |
          python .github/scripts/build_static.py
          cp static/index.html index.html

      - name: 发送邮件日报
        env:
          # 默认按 QQ 邮箱 SSL 配置；如需改其它邮箱，在仓库 Secrets 里覆盖即可
          SMTP_HOST: ${{ secrets.SMTP_HOST != '' && secrets.SMTP_HOST || 'smtp.qq.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT != '' && secrets.SMTP_PORT || '465' }}
          USE_SSL:   ${{ secrets.USE_SSL   != '' && secrets.USE_SSL   || 'True' }}
          USE_TLS:   ${{ secrets.USE_TLS   != '' && secrets.USE_TLS   || 'False' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python .github/scripts/send_email.py

      - name: 提交并推送更新到 GitHub
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # 由于 .gitignore 屏蔽了 *.db，这里强制把订阅库和文章库纳入提交
          git add -f hr_daily.db
          git add index.html static/index.html data.js
          git diff --cached --quiet && echo "无变更" && exit 0
          git commit -m "chore: 自动更新日报数据 $(date +%Y-%m-%d)"
          # 拉取最新远端（可能 EdgeOne Function 刚刚提交了 subscribers.json）后再推
          git pull --rebase --autostash origin main || true
          git push
