name: 每日自动更新HR日报

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 运行抓取脚本
        run: python .github/scripts/fetch_articles.py

      - name: 生成 data.js
        run: python backend/generate_data_js.py

      - name: 构建前端
        run: |
          python .github/scripts/build_static.py
          cp static/index.html index.html

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装 EdgeOne CLI
        run: npm install -g edgeone

      - name: 部署到 EdgeOne Pages
        run: npx edgeone pages deploy . -n hr-daily2 -t ${{ secrets.EDGEONE_API_TOKEN }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
